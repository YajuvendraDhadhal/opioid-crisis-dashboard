name: Probe data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CMS Part D by Provider and Drug 2020 (first lines)
        run: |
          curl -sL -r 0-3000 "https://data.cms.gov/sites/default/files/2024-05/75fecc51-c9e8-4904-b570-9da9dc101721/MUP_DPR_RY24_P04_V10_DY20_NPIBN.csv" | head -5
          curl -sIL "https://data.cms.gov/sites/default/files/2024-05/75fecc51-c9e8-4904-b570-9da9dc101721/MUP_DPR_RY24_P04_V10_DY20_NPIBN.csv" | grep -i -E "content-length|HTTP/"
          echo "== catalog entries for 2020"
          curl -sL "https://data.cms.gov/data.json" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for ds in d['dataset']:
              if 'Part D Prescribers - by Provider' in ds['title'] or 'Part D Prescribers - by Geography and Drug' in ds['title']:
                  for x in ds.get('distribution',[]):
                      if '2020' in x.get('title','') and x.get('mediaType')=='text/csv': print(x['title'],'|',x.get('downloadURL'))
          "
      - name: CDC VSRR
        run: |
          pip -q install pandas openpyxl
          curl -sL "https://data.cdc.gov/api/views/xkb8-kh2a/rows.csv?accessType=DOWNLOAD" -o cdc.csv; wc -l cdc.csv; head -3 cdc.csv
          python3 -c "
          import pandas as pd; d=pd.read_csv('cdc.csv'); print(d.columns.tolist()); print(d['Indicator'].value_counts().to_string()); print(d['Year'].unique()); print(d['Month'].unique()); print(d['State'].unique()); s=d[(d.Year==2020)&(d.Month=='December')]; print(s.pivot_table(index='State',columns='Indicator',values='Data Value',aggfunc='first').notna().sum().to_string())"
      - name: AHRQ SDOH 2020 county
        run: |
          pip -q install pandas openpyxl
          curl -sL "https://www.ahrq.gov/sites/default/files/wysiwyg/sdoh/clh_2020_county_2_0.xlsx" -o sdoh.xlsx; ls -la sdoh.xlsx; file sdoh.xlsx
          python3 -c "
          import pandas as pd; x=pd.ExcelFile('sdoh.xlsx'); print(x.sheet_names)
          d=x.parse(x.sheet_names[-1] if len(x.sheet_names)>1 else 0, nrows=5); print(d.shape)
          cols=d.columns.tolist(); print(cols[:15]); print([c for c in cols if any(k in c.upper() for k in ['UNEMP','POV','UNINS','GINI','MEDIAN_HH','TOT_POP','STATE'])])"
