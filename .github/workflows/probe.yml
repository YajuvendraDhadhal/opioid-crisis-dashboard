name: Probe data sources
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: AHRQ SDOH 2020 county
        run: |
          pip -q install pandas openpyxl
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in https://www.ahrq.gov/sites/default/files/wysiwyg/sdoh/clh_2020_county_2_0.xlsx https://www.ahrq.gov/sites/default/files/wysiwyg/sdoh/SDOH_2020_COUNTY_1_0.xlsx https://www.ahrq.gov/sites/default/files/wysiwyg/sdoh/SDOH_2020_COUNTY_1_0.XLSX; do
            echo "== $u"; curl -sL -A "$UA" "$u" -o t.xlsx -w "%{http_code} %{size_download}\n"; file t.xlsx; head -c 400 t.xlsx | strings | head -5
            if file t.xlsx | grep -q -i "zip\|excel\|microsoft"; then cp t.xlsx sdoh.xlsx; break; fi
          done
          python3 -c "
          import pandas as pd; x=pd.ExcelFile('sdoh.xlsx'); print(x.sheet_names)
          for s in x.sheet_names:
              d=x.parse(s, nrows=3); cols=d.columns.tolist(); print(s, d.shape, cols[:12]); print([c for c in cols if any(k in str(c).upper() for k in ['UNEMP','POV','UNINS','GINI','MEDIAN_HH','TOT_POP','STATE'])][:40])"
